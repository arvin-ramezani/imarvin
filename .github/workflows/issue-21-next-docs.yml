name: issue-21-next-docs

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect bundled Next.js guidance
        run: |
          node -p "require('next/package.json').version"
          echo "::group::beforeInteractive"
          grep -R -n -m 20 "beforeInteractive" node_modules/next/dist/docs/ || true
          echo "::endgroup::"
          echo "::group::hydration"
          grep -R -n -m 20 "suppressHydrationWarning\|hydration mismatch" node_modules/next/dist/docs/ || true
          echo "::endgroup::"
          echo "::group::root-layout"
          grep -R -n -m 20 "Root Layout\|root layout" node_modules/next/dist/docs/01-app/ || true
          echo "::endgroup::"
