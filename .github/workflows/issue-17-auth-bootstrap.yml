name: issue-17-auth-bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: imarvin_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d imarvin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ORIGIN: http://localhost:3000
      AUTH_SECRET: test-auth-secret-at-least-32-characters
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/imarvin_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/17-owner-auth-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11.21.0
      - name: Regenerate dependency lock
        run: |
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Generate current Prisma client
        run: npm run db:generate
      - name: Generate Better Auth Prisma schema
        run: |
          guarded_files=(
            lib/auth/instance.ts
            lib/config/server.ts
            lib/db/index.ts
            lib/logging/logger.ts
          )
          trap 'git checkout -- "${guarded_files[@]}"' EXIT
          for file in "${guarded_files[@]}"; do
            sed -i '/^import "server-only";$/d' "$file"
          done
          npm run auth:generate
      - name: Generate updated Prisma client
        run: npm run db:generate
      - name: Create auth migration
        run: |
          mkdir -p prisma/migrations/20261005100000_owner_auth
          npx prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script --output prisma/migrations/20261005100000_owner_auth/migration.sql
      - name: Apply migrations
        run: npm run db:migrate:deploy
      - name: Check auth schema
        run: npm run auth:check
      - name: Commit generated foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json prisma/schema.prisma prisma/migrations
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: generate Better Auth schema and migration"
          git push origin HEAD:feat/17-owner-auth-foundation
